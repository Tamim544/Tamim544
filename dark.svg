<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.1" />
            <stop offset="100%" stop-color="#030712" stop-opacity="1" />
        </radialGradient>
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7C3AED">
                <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="8s" repeatCount="indefinite"/>
            </stop>
            <stop offset="100%" stop-color="#10B981">
                <animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="8s" repeatCount="indefinite"/>
            </stop>
        </linearGradient>
        
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <clipPath id="typingClip">
            <rect x="0" y="0" width="0" height="40">
                <animate attributeName="width" values="0;400;400;0;0" keyTimes="0;0.2;0.8;0.9;1" dur="10s" repeatCount="indefinite" />
            </rect>
        </clipPath>
        
        <clipPath id="scanlineClip">
            <rect x="0" y="0" width="1180" height="20">
                <animate attributeName="y" values="-20;630" dur="4s" repeatCount="indefinite" />
            </rect>
        </clipPath>
    </defs>

    <!-- Background -->
    <rect width="1180" height="610" fill="#030712" rx="20" />
    <rect width="1180" height="610" fill="url(#bgGrad)" rx="20" />
    
    <!-- Scanline overlay -->
    <rect width="1180" height="610" fill="rgba(255,255,255,0.01)" clip-path="url(#scanlineClip)" />
    
    <!-- Border Shimmer -->
    <rect width="1178" height="608" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" rx="19" />

    <!-- Split Panels -->
    <!-- Left Panel (ASCII) -->
    <g transform="translate(30, 30)">
        <rect width="400" height="550" fill="#0F172A" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="1" opacity="0.8" />
        <g transform="translate(50, 100)" font-family="monospace" font-size="20" font-weight="bold" fill="url(#textGrad)">
            <animateTransform attributeName="transform" type="translate" values="50,100; 50,110; 50,100" dur="6s" repeatCount="indefinite"/>
            <text x="0" y="0" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="10s" begin="0s" repeatCount="indefinite" fill="freeze" />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;:::&nbsp;&nbsp;&nbsp;:::&nbsp;&nbsp;&nbsp;:::&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;:::&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</text>
            <text x="0" y="30" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="10s" begin="0.5s" repeatCount="indefinite" fill="freeze" />&nbsp;&nbsp;&nbsp;&nbsp;:+:+:&nbsp;:+:+:&nbsp;&nbsp;:+:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;:+:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</text>
            <text x="0" y="60" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="10s" begin="1.0s" repeatCount="indefinite" fill="freeze" />&nbsp;&nbsp;+:+&nbsp;+:+:+&nbsp;+:+&nbsp;+:+&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;+:+&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</text>
            <text x="0" y="90" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="10s" begin="1.5s" repeatCount="indefinite" fill="freeze" />&nbsp;+#+&nbsp;&nbsp;+:+&nbsp;&nbsp;+#+&nbsp;+#+&nbsp;&nbsp;+:+&nbsp;&nbsp;+#+&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</text>
            <text x="0" y="120" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="10s" begin="2.0s" repeatCount="indefinite" fill="freeze" />+#+&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;+#+&nbsp;#+#&nbsp;+#+#+&nbsp;#+#&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</text>
            <text x="0" y="150" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="10s" begin="2.5s" repeatCount="indefinite" fill="freeze" />#+#&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;#+#&nbsp;&nbsp;#+#+#&nbsp;#+#+#&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</text>
            <text x="0" y="180" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="10s" begin="3.0s" repeatCount="indefinite" fill="freeze" />###&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;###&nbsp;&nbsp;&nbsp;###&nbsp;&nbsp;&nbsp;###&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</text>

        </g>
        <text x="100" y="450" fill="#94A3B8" font-family="monospace" font-size="14">Initializing Terminal...</text>
    </g>

    <!-- Right Panel -->
    <g transform="translate(450, 30)">
        <rect width="700" height="550" fill="#0F172A" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="1" opacity="0.8" />
        
        <g transform="translate(40, 60)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji, Segoe UI Symbol">
            
            <text x="0" y="0" font-size="24" fill="#94A3B8">Hi 👋</text>
            <text x="0" y="45" font-size="42" font-weight="900" fill="#F8FAFC">I'm Tamim Chowdhury</text>
            
            <!-- Animated Typing Text -->
            <g transform="translate(0, 90)">
                <text x="0" y="0" font-size="28" font-weight="600" fill="url(#textGrad)" clip-path="url(#typingClip)">
                    Full-Stack AI Engineer
                </text>
                <rect x="0" y="-25" width="4" height="30" fill="#22D3EE">
                    <animate attributeName="x" values="0;340;340;0;0" keyTimes="0;0.2;0.8;0.9;1" dur="10s" repeatCount="indefinite" />
                    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
                </rect>
            </g>
            
            <!-- Details -->
            <g transform="translate(0, 160)" font-size="16" fill="#94A3B8">
                <text x="0" y="0" opacity="0">
                    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" dur="5s" begin="1s" repeatCount="indefinite" fill="freeze"/>
                    📍 Location: IIIT-Delhi (ICCR Scholar)
                </text>
                <text x="0" y="35" opacity="0">
                    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" dur="5s" begin="1.5s" repeatCount="indefinite" fill="freeze"/>
                    🎓 Education: B.Tech Computer Science
                </text>
                <text x="0" y="70" opacity="0">
                    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" dur="5s" begin="2s" repeatCount="indefinite" fill="freeze"/>
                    🎯 Focus: Advanced ML, LLMs, RAG, & Next.js
                </text>
                <text x="0" y="105" opacity="0">
                    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" dur="5s" begin="2.5s" repeatCount="indefinite" fill="freeze"/>
                    🌐 Portfolio: tamim544.github.io
                </text>
            </g>

            <!-- Skills (Pills) -->
            <text x="0" y="320" font-size="20" font-weight="700" fill="#F8FAFC">Tech Stack</text>
            <g transform="translate(0, 350)">

                <g transform="translate(0, 0)">
                    <rect width="100" height="35" rx="8" fill="#030712" stroke="rgba(255,255,255,0.08)" stroke-width="1">
                        <animate attributeName="stroke" values="rgba(255,255,255,0.08);#22D3EE;rgba(255,255,255,0.08)" dur="4s" begin="0.0s" repeatCount="indefinite" />
                    </rect>
                    <text x="50" y="22" font-size="14" fill="#94A3B8" font-weight="600" text-anchor="middle">React</text>
                </g>

                <g transform="translate(110, 0)">
                    <rect width="100" height="35" rx="8" fill="#030712" stroke="rgba(255,255,255,0.08)" stroke-width="1">
                        <animate attributeName="stroke" values="rgba(255,255,255,0.08);#22D3EE;rgba(255,255,255,0.08)" dur="4s" begin="0.2s" repeatCount="indefinite" />
                    </rect>
                    <text x="50" y="22" font-size="14" fill="#94A3B8" font-weight="600" text-anchor="middle">Next.js</text>
                </g>

                <g transform="translate(220, 0)">
                    <rect width="100" height="35" rx="8" fill="#030712" stroke="rgba(255,255,255,0.08)" stroke-width="1">
                        <animate attributeName="stroke" values="rgba(255,255,255,0.08);#22D3EE;rgba(255,255,255,0.08)" dur="4s" begin="0.4s" repeatCount="indefinite" />
                    </rect>
                    <text x="50" y="22" font-size="14" fill="#94A3B8" font-weight="600" text-anchor="middle">TypeScript</text>
                </g>

                <g transform="translate(330, 0)">
                    <rect width="100" height="35" rx="8" fill="#030712" stroke="rgba(255,255,255,0.08)" stroke-width="1">
                        <animate attributeName="stroke" values="rgba(255,255,255,0.08);#22D3EE;rgba(255,255,255,0.08)" dur="4s" begin="0.6000000000000001s" repeatCount="indefinite" />
                    </rect>
                    <text x="50" y="22" font-size="14" fill="#94A3B8" font-weight="600" text-anchor="middle">Tailwind</text>
                </g>

                <g transform="translate(440, 0)">
                    <rect width="100" height="35" rx="8" fill="#030712" stroke="rgba(255,255,255,0.08)" stroke-width="1">
                        <animate attributeName="stroke" values="rgba(255,255,255,0.08);#22D3EE;rgba(255,255,255,0.08)" dur="4s" begin="0.8s" repeatCount="indefinite" />
                    </rect>
                    <text x="50" y="22" font-size="14" fill="#94A3B8" font-weight="600" text-anchor="middle">Python</text>
                </g>

                <g transform="translate(550, 0)">
                    <rect width="100" height="35" rx="8" fill="#030712" stroke="rgba(255,255,255,0.08)" stroke-width="1">
                        <animate attributeName="stroke" values="rgba(255,255,255,0.08);#22D3EE;rgba(255,255,255,0.08)" dur="4s" begin="1.0s" repeatCount="indefinite" />
                    </rect>
                    <text x="50" y="22" font-size="14" fill="#94A3B8" font-weight="600" text-anchor="middle">ML</text>
                </g>

                <g transform="translate(0, 45)">
                    <rect width="100" height="35" rx="8" fill="#030712" stroke="rgba(255,255,255,0.08)" stroke-width="1">
                        <animate attributeName="stroke" values="rgba(255,255,255,0.08);#22D3EE;rgba(255,255,255,0.08)" dur="4s" begin="1.2000000000000002s" repeatCount="indefinite" />
                    </rect>
                    <text x="50" y="22" font-size="14" fill="#94A3B8" font-weight="600" text-anchor="middle">PyTorch</text>
                </g>

                <g transform="translate(110, 45)">
                    <rect width="100" height="35" rx="8" fill="#030712" stroke="rgba(255,255,255,0.08)" stroke-width="1">
                        <animate attributeName="stroke" values="rgba(255,255,255,0.08);#22D3EE;rgba(255,255,255,0.08)" dur="4s" begin="1.4000000000000001s" repeatCount="indefinite" />
                    </rect>
                    <text x="50" y="22" font-size="14" fill="#94A3B8" font-weight="600" text-anchor="middle">Neo4j</text>
                </g>

                <g transform="translate(220, 45)">
                    <rect width="100" height="35" rx="8" fill="#030712" stroke="rgba(255,255,255,0.08)" stroke-width="1">
                        <animate attributeName="stroke" values="rgba(255,255,255,0.08);#22D3EE;rgba(255,255,255,0.08)" dur="4s" begin="1.6s" repeatCount="indefinite" />
                    </rect>
                    <text x="50" y="22" font-size="14" fill="#94A3B8" font-weight="600" text-anchor="middle">Postgres</text>
                </g>

                <g transform="translate(330, 45)">
                    <rect width="100" height="35" rx="8" fill="#030712" stroke="rgba(255,255,255,0.08)" stroke-width="1">
                        <animate attributeName="stroke" values="rgba(255,255,255,0.08);#22D3EE;rgba(255,255,255,0.08)" dur="4s" begin="1.8s" repeatCount="indefinite" />
                    </rect>
                    <text x="50" y="22" font-size="14" fill="#94A3B8" font-weight="600" text-anchor="middle">AWS</text>
                </g>

                <g transform="translate(440, 45)">
                    <rect width="100" height="35" rx="8" fill="#030712" stroke="rgba(255,255,255,0.08)" stroke-width="1">
                        <animate attributeName="stroke" values="rgba(255,255,255,0.08);#22D3EE;rgba(255,255,255,0.08)" dur="4s" begin="2.0s" repeatCount="indefinite" />
                    </rect>
                    <text x="50" y="22" font-size="14" fill="#94A3B8" font-weight="600" text-anchor="middle">Docker</text>
                </g>

                <g transform="translate(550, 45)">
                    <rect width="100" height="35" rx="8" fill="#030712" stroke="rgba(255,255,255,0.08)" stroke-width="1">
                        <animate attributeName="stroke" values="rgba(255,255,255,0.08);#22D3EE;rgba(255,255,255,0.08)" dur="4s" begin="2.2s" repeatCount="indefinite" />
                    </rect>
                    <text x="50" y="22" font-size="14" fill="#94A3B8" font-weight="600" text-anchor="middle">FastAPI</text>
                </g>

            </g>
        </g>
    </g>
</svg>
